appId: com.ruodao.guard
productName: Ruodao Guard
directories:
  output: release
  buildResources: build
electronDist: node_modules/electron/dist
files:
  - out/**
  - package.json
asar: true
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 若道安全卫士
  artifactName: RuodaoGuard-Setup-${version}.${ext}
